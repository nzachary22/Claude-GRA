[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grant-reporting-assistant"
version = "1.4.0"
description = "Local grant-reporting assistant: protected SQLite data, AI-built aggregate report tables."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlglot>=25",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4",
    "anthropic>=2.3",
    "openai>=3.40",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
grant-reporting-assistant = "gra.server:main"

[tool.setuptools.packages.find]
include = ["gra*"]

[tool.setuptools.package-data]
gra = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
